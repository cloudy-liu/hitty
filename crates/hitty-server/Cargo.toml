[package]
name = "hitty-server"
version.workspace = true
edition.workspace = true
description = "hitty's headless session server: the persistent terminal daemon, with no GUI attached"
repository = "https://github.com/cloudy-liu/hitty"
license = "Apache-2.0"
publish = false

[[bin]]
name = "hitty-server"
path = "src/main.rs"

# One dependency, on purpose. This binary exists to prove — and keep proving —
# that everything a hitty session needs runs without gpui: if it ever grows a
# second dependency that the GUI also needs, that dependency belongs in
# `hitty-core` instead.
[dependencies]
hitty-core = { path = "../hitty-core" }

# The end-to-end proof (`tests/stdio_conformance.rs`) runs `hitty-core`'s shared
# `Host` conformance suite against a *real* `hitty-server --stdio` child process.
# It has to live in this crate because that is the crate that owns the binary —
# `CARGO_BIN_EXE_hitty-server` only exists for its own tests.
[dev-dependencies]
# Inspect the real hc protocol in the isolated pane-engine integration tests.
serde_json.workspace = true
# Sandboxes for the suite: an empty directory per case, removed on drop. The
# server is on this machine, so a local temp dir is a path in its namespace.
tempfile = "3"
# `tests/daemon_stop.rs` probes and, on failure, kills the daemon it spawned;
# a pid needs `kill(2)`, which `Child` cannot express once ownership has moved
# to the thread collecting the exit.
libc = "0.2"
[lints]
workspace = true
