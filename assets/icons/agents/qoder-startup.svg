<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 5 5" shape-rendering="crispEdges" role="img" aria-labelledby="title">
  <title id="title">Qoder CLI startup mark</title>
  <desc>Qoder CLI 1.1.96 startup glyph, converted to vector from its terminal block characters.
The glyph and color are from Qoder CLI. This SVG is a local conversion.</desc>
  <g fill="#27BD51">
    <rect x="1" y="0" width="3" height="1"/>
    <rect x="0" y="1" width="1" height="1"/>
    <rect x="4" y="1" width="1" height="1"/>
    <rect x="0" y="2" width="1" height="1"/>
    <rect x="2" y="2" width="1" height="1"/>
    <rect x="4" y="2" width="1" height="1"/>
    <rect x="0" y="3" width="1" height="1"/>
    <rect x="3" y="3" width="1" height="1"/>
    <rect x="1" y="4" width="2" height="1"/>
    <rect x="4" y="4" width="1" height="1"/>
  </g>
</svg>
