<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hitty · 目录零会话原型</title>
  <style>
    :root {
      color-scheme: light;
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", sans-serif;
      color: #25282e;
      background: #eae9e6;
      --sidebar: #f0f0f0;
      --surface: #f7f7f7;
      --line: #d1d0cd;
      --muted: #62666e;
      --hover: #e3e3e3;
      --accent: #355fe1;
    }
    * { box-sizing: border-box; }
    body { max-width: 1160px; margin: 0 auto; padding: 48px 28px 24px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .review { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 20px; }
    h1 { margin: 0 0 4px; font-size: clamp(21px, 3.5vw, 30px); font-weight: 650; letter-spacing: -.03em; }
    p { margin: 0; color: var(--muted); }
    .review-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .review-actions button { border: 1px solid #c9c8c3; background: #f8f7f4; padding: 7px 12px; border-radius: 6px; white-space: nowrap; }
    .review-actions button:hover { background: white; }
    .window { overflow: hidden; border: 1px solid #bdbdbd; border-radius: 10px; background: var(--surface); box-shadow: 0 16px 38px #25252517; }
    .titlebar { display: flex; align-items: center; height: 38px; padding: 0 14px; gap: 8px; border-bottom: 1px solid var(--line); background: #f3f3f3; font-weight: 600; }
    .titlebar img { width: 19px; height: 19px; }
    .window-controls { margin-left: auto; letter-spacing: 5px; color: var(--muted); font-weight: 400; }
    .workspace { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 430px; }
    .sidebar { background: var(--sidebar); padding: 12px 6px 16px; border-right: 1px solid var(--line); }
    .workspace-name { display: flex; align-items: center; gap: 7px; padding: 0 8px 11px; font-weight: 650; }
    .workspace-avatar { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #e5e5e5; font-size: 12px; color: var(--muted); }
    .folder + .folder { margin-top: 4px; }
    .folder[data-pinned="true"] + .folder[data-pinned="false"] { border-top: 1px solid #d6d6d6; margin-top: 8px; padding-top: 8px; }
    .folder-head { display: flex; min-height: 30px; align-items: center; padding-right: 4px; border-radius: 5px; }
    .folder-head:is(:hover, :focus-within) { background: var(--hover); }
    .folder-name, .icon-button, .placeholder, .session-main { border: 0; background: transparent; }
    .folder-name { display: flex; align-items: center; gap: 5px; min-width: 0; flex: 1; text-align: left; padding: 4px 7px; color: var(--muted); }
    .folder-name strong { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chevron { transition: transform 120ms ease; }
    .folder-name[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .actions { display: flex; opacity: 0; }
    .folder-head:is(:hover, :focus-within) .actions { opacity: 1; }
    .icon-button { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 4px; color: var(--muted); }
    .icon-button:hover { background: #d9d9d9; color: #24262c; }
    .icon { display: inline-block; flex: none; width: 14px; height: 14px; background: currentColor; mask: var(--icon) center / contain no-repeat; }
    .placeholder { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 4px 8px 4px 24px; border-radius: 6px; text-align: left; color: var(--muted); }
    .placeholder:hover { background: var(--hover); color: #25282e; }
    .placeholder .avatar { border: 1px dashed #9b9da1; }
    .avatar { display: grid; place-items: center; flex: none; width: 23px; height: 23px; border-radius: 50%; }
    .avatar .icon { width: 12px; height: 12px; }
    .session { display: flex; align-items: center; padding-right: 5px; border-radius: 6px; }
    .session:is(:hover, :focus-within) { background: var(--hover); }
    .session[data-active="true"] { background: #dedee1; }
    .session-main { display: flex; align-items: center; gap: 8px; text-align: left; flex: 1; padding: 5px 6px 5px 24px; }
    .session-main .avatar { background: #f1f1f1; color: var(--muted); }
    .session-main small { display: block; color: var(--muted); }
    .surface { min-width: 0; min-height: 280px; display: grid; align-items: center; }
    .home { text-align: center; padding: 30px 12px; }
    .wordmark { display: inline-block; margin: 0 0 16px; font: 23px/1 "Cascadia Mono", Consolas, monospace; color: #777980; text-align: left; }
    .terminal { align-self: stretch; padding: 14px 16px; font: 15px/1.55 "Cascadia Mono", Consolas, monospace; overflow-wrap: anywhere; }
    .terminal .prompt { color: #2c3038; }
    .caret { display: inline-block; width: .55em; height: 1.1em; background: var(--accent); vertical-align: text-bottom; }
    .feedback { margin-top: 12px; min-height: 1.5em; }
    @media (hover: none) { .actions { opacity: 1; } }
    @media (max-width: 650px) {
      body { padding: 23px 14px; }
      .review { align-items: start; flex-direction: column; }
      .workspace { grid-template-columns: minmax(0, 1fr); min-height: 0; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .surface { min-height: 220px; }
      .actions { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }
  </style>
</head>
<body>
  <header class="review">
    <div>
      <h1>目录可以有 0 个会话</h1>
      <p>点占位行的「+」新建终端，再点会话的「×」回到空状态。</p>
    </div>
    <div class="review-actions">
      <button type="button" data-action="restart">模拟重启</button>
      <button type="button" data-action="reset">重置示例</button>
    </div>
  </header>

      <span>Hitty</span>
      <span class="window-controls" aria-hidden="true">− □ ×</span>
    </div>
    <div class="workspace">
      <nav class="sidebar" aria-label="目录与会话">
        <div class="workspace-name"><span class="workspace-avatar" aria-hidden="true">D</span>开发工作区</div>
        <div id="folders"></div>
      </nav>
      <section class="surface" id="surface" aria-label="终端区"></section>
    </div>
  </section>
  <p class="feedback" id="feedback" role="status">hitty 已 Pin，notes 未 Pin。两处占位行都可以点击。</p>

  <template id="home">
    <div class="home">
      <pre class="wordmark" aria-label="Hitty"> ▄  ▄ ▄ ▄▄▄ ▄▄▄ ▄  ▄
 █▄▄█ ▄  █   █  █  █
 █  █ █  █   █  ▀▄▄█
 ▀  ▀ ▀  ▀▄  ▀▄ ▄▄▄▀</pre>
      <p>从左侧目录新建终端</p>
    </div>
  </template>
  <script>
    const assets = {
      plus: "PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyLjU4NDYiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+PHBhdGggZD0iTTEyIDQuOTg0NnYxNC4wMzA4Ii8+PHBhdGggZD0iTTQuOTg0NiAxMmgxNC4wMzA4Ii8+PC9zdmc+Cg==",
      chevron: "PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIxLjYiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0ibTYgOSA2IDYgNi02Ii8+PC9zdmc+",
      terminal: "PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyLjEiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTUuOCA4LjQgOS43IDEybC0zLjkgMy42Ii8+PHBhdGggZD0iTTEyLjkgMTUuNmg1LjYiLz48L3N2Zz4K",
      pin: "PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIGQ9Ik0xMiAxN3Y1Ii8+PHBhdGggZD0iTTkgMTAuNzZhMiAyIDAgMCAxLTEuMTEgMS43OWwtMS43OC45QTIgMiAwIDAgMCA1IDE1LjI0VjE2YTEgMSAwIDAgMCAxIDFoMTJhMSAxIDAgMCAwIDEtMXYtLjc2YTIgMiAwIDAgMC0xLjExLTEuNzlsLTEuNzgtLjlBMiAyIDAgMCAxIDE1IDEwLjc2VjdhMSAxIDAgMCAxIDEtMSAyIDIgMCAwIDAgMC00SDhhMiAyIDAgMCAwIDAgNCAxIDEgMCAwIDEgMSAxeiIvPjwvc3ZnPgo=",
      pinned: "PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJjdXJyZW50Q29sb3IiIHN0cm9rZT0iY3VycmVudENvbG9yIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTEyIDE3djUiIGZpbGw9Im5vbmUiLz48cGF0aCBkPSJNOSAxMC43NmEyIDIgMCAwIDEtMS4xMSAxLjc5bC0xLjc4LjlBMiAyIDAgMCAwIDUgMTUuMjRWMTZhMSAxIDAgMCAwIDEgMWgxMmExIDEgMCAwIDAgMS0xdi0uNzZhMiAyIDAgMCAwLTEuMTEtMS43OWwtMS43OC0uOUEyIDIgMCAwIDEgMTUgMTAuNzZWN2ExIDEgMCAwIDEgMS0xIDIgMiAwIDAgMCAwLTRIOGEyIDIgMCAwIDAgMCA0IDEgMSAwIDAgMSAxIDF6Ii8+PC9zdmc+Cg==",
      unpin: "PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwYXRoIGQ9Ik0xMiAxN3Y1Ii8+PHBhdGggZD0iTTE1IDkuMzRWN2ExIDEgMCAwIDEgMS0xIDIgMiAwIDAgMCAwLTRINy44OSIvPjxwYXRoIGQ9Im0yIDIgMjAgMjAiLz48cGF0aCBkPSJNOSA5djEuNzZhMiAyIDAgMCAxLTEuMTEgMS43OWwtMS43OC45QTIgMiAwIDAgMCA1IDE1LjI0VjE2YTEgMSAwIDAgMCAxIDFoMTEiLz48L3N2Zz4K",
    };
    const icon = (name, extra = "") => `<span class="icon ${extra}" style="--icon:url(data:image/svg+xml;base64,${assets[name]})" aria-hidden="true"></span>`;
    const folderList = document.querySelector("#folders");
    const surface = document.querySelector("#surface");
    const status = document.querySelector("#feedback");
    const home = document.querySelector("#home");

    const initialFolders = () => [
      { name: "hitty", path: "D:\\Projects\\hitty", pinned: true, expanded: true, sessions: [] },
      { name: "notes", path: "D:\\Projects\\notes", pinned: false, expanded: true, sessions: [] },
    ];
    let folders = initialFolders();
    let active = null;
    let nextSessionId = 1;

    function emptyRow(folder) {
      return `<button type="button" class="placeholder" data-action="start" title="${folder.path}">
        <span class="avatar">${icon("plus")}</span>在 ${folder.name} 中新建标签页
      </button>`;
    }

    function sessionRow(folder, id) {
      return `<div class="session" data-session="${id}" data-active="${active?.id === id}">
        <button type="button" class="session-main" data-action="select" aria-pressed="${active?.id === id}">
          <span class="avatar">${icon("terminal")}</span><span>cmd<small>…/${folder.name}</small></span>
        </button>
        <button type="button" class="icon-button" data-action="close" aria-label="关闭 ${folder.name} 中的终端" title="关闭会话">×</button>
      </div>`;
    }

    function renderFolder(folder) {
      const pinLabel = folder.pinned ? "取消固定" : "固定分组";
      return `<section class="folder" data-folder="${folder.name}" data-pinned="${folder.pinned}">
        <div class="folder-head">
          <button type="button" class="folder-name" data-action="fold" aria-expanded="${folder.expanded}" title="${folder.path}">
            ${icon("chevron", "chevron")}<strong>${folder.name}</strong>
            ${folder.pinned ? icon("pinned") : ""}<span aria-label="${folder.sessions.length} 个会话">${folder.sessions.length}</span>
          </button>
          <div class="actions">
            <button type="button" class="icon-button" data-action="pin" aria-label="${pinLabel} ${folder.name}" title="${pinLabel}">${icon(folder.pinned ? "unpin" : "pin")}</button>
            <button type="button" class="icon-button" data-action="start" aria-label="在 ${folder.name} 中新建终端" title="新建终端">${icon("plus")}</button>
          </div>
        </div>
        <div ${folder.expanded ? "" : "hidden"}>
          ${folder.sessions.length ? folder.sessions.map(id => sessionRow(folder, id)).join("") : emptyRow(folder)}
        </div>
      </section>`;
    }

    function render() {
      const ordered = [...folders].sort((a, b) => Number(b.pinned) - Number(a.pinned));
      folderList.innerHTML = ordered.map(renderFolder).join("");
      if (active) {
        const terminal = document.createElement("div");
        terminal.className = "terminal";
        terminal.innerHTML = `<span class="prompt">${active.folder.path}&gt;</span><span class="caret" aria-hidden="true"></span>`;
        surface.replaceChildren(terminal);
      } else {
        surface.replaceChildren(home.content.cloneNode(true));
      }
    }

    function start(folder) {
      const id = nextSessionId++;
      folder.sessions.push(id);
      folder.expanded = true;
      active = { folder, id };
      status.textContent = `已在 ${folder.path} 中打开默认终端。`;
    }

    function close(folder, id) {
      folder.sessions = folder.sessions.filter(session => session !== id);
      if (active?.id === id) {
        const next = folder.sessions.length ? folder : folders.find(entry => entry.sessions.length);
        active = next ? { folder: next, id: next.sessions.at(-1) } : null;
      }
      status.textContent = `${folder.name} 还有 ${folder.sessions.length} 个会话。`;
    }

    function restart() {
      const name = active?.folder.name;
      const id = active?.id;
      folders = JSON.parse(JSON.stringify(folders));
      active = id ? { folder: folders.find(entry => entry.name === name), id } : null;
      status.textContent = "模拟重启完成，工作区目录已恢复。";
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const { action } = button.dataset;
      const name = button.closest("[data-folder]")?.dataset.folder;
      const folder = folders.find(entry => entry.name === name);
      const id = Number(button.closest("[data-session]")?.dataset.session);
      let focus = action;

      switch (action) {
        case "start": start(folder); focus = "select"; break;
        case "close": close(folder, id); focus = folder.sessions.length ? "select" : "start"; break;
        case "select": active = { folder, id }; break;
        case "fold": folder.expanded = !folder.expanded; break;
        case "pin":
          folder.pinned = !folder.pinned;
          status.textContent = `${folder.name} ${folder.pinned ? "已固定" : "已取消固定"}。`;
          break;
        case "restart": restart(); break;
        case "reset":
          folders = initialFolders();
          active = null;
          status.textContent = "hitty 已 Pin，notes 未 Pin。两处占位行都可以点击。";
          break;
      }
      render();
      if (folder) {
        const section = folderList.querySelector(`[data-folder="${name}"]`);
        const focusTarget = focus === "start" ? section.querySelector(".placeholder") : section.querySelector(`[data-action="${focus}"]`);
        focusTarget?.focus({ preventScroll: true });
      }
    });

    render();
  </script>
</body>
</html>
