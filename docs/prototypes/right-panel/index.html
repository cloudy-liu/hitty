.commit-split{display:flex;align-items:stretch;border-radius:6px;overflow:hidden;background:var(--hover)}.commit-split button{background:transparent;font-size:12px;padding:5px 10px}.commit-split button:hover{background:var(--selected)}.commit-split button:last-child{border-left:1px solid var(--surface);padding:5px}.commit-split .icon{width:16px;height:16px}
.scm-groups{padding:0 12px;overflow:auto;flex:1}.scm-group{margin:4px 0 12px}
.scm-group-title{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:28px;border-radius:5px}.scm-group-title>button:first-child{display:flex;align-items:center;gap:6px;background:transparent;color:var(--muted);padding:5px;font-size:11px;font-weight:600;flex:1;text-align:left}.scm-group-title:hover{background:var(--hover)}.scm-group-title .icon{width:14px;height:14px}.group-count{font-size:10px;font-weight:400;margin-left:3px}
.scm-file{position:relative;border-radius:5px}.scm-file:hover{background:var(--hover)}.scm-file .git-row{height:26px;padding:3px 5px;gap:6px}.scm-file .git-row:hover{background:transparent}.scm-filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scm-status{font:11px Consolas,monospace;width:12px;color:var(--positive)}.scm-dir{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--muted);margin-left:auto}.scm-file .file-icon{width:16px;height:16px}
.scm-history{padding:10px 15px 15px;flex:none;max-height:230px;overflow:auto}.history-filter{width:100%;border:0;background:var(--hover);border-radius:5px;padding:6px 8px;font-size:12px;color:var(--text);margin:4px 0 7px}.history-row{display:flex;gap:9px;align-items:center;padding:3px 5px}.history-row button{background:transparent;text-align:left;font-size:12px;flex:1;padding:4px;border-radius:5px}.history-row button:hover{background:var(--hover)}.history-row button span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.graph-dot{width:7px;height:7px;border:1px solid var(--positive);border-radius:50%;flex:none}
.review-tools{flex-wrap:wrap}.review-button{font-size:11px}.review-footer{line-height:1.7}
.context-menu{max-height:calc(100vh - 20px);overflow:auto}.context-menu button:focus{background:var(--hover)}
.confirm-demo{padding:22px;max-width:380px;border:1px solid var(--line);border-radius:10px;background:var(--canvas);color:var(--text);box-shadow:var(--shadow)}.confirm-demo::backdrop{background:#1115}.confirm-demo p{font-size:13px;line-height:1.8;margin:0 0 18px}.confirm-demo footer{display:flex;justify-content:flex-end;gap:8px}.confirm-demo button{padding:6px 12px;border-radius:6px;background:var(--hover);font-size:12px}.confirm-demo .confirm-danger{background:var(--negative);color:var(--canvas)}


.mode-bar{gap:6px;height:58px;padding:9px 12px 11px}
.mode{height:30px;min-width:30px;padding:7px;border-radius:8px;gap:6px}
.mode[aria-selected=true]{padding-left:10px;padding-right:11px}
.mode .icon{width:16px;height:16px}.mode-label{font-size:14px;line-height:20px;font-weight:400}
.content-tabs{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.document-tab{display:flex;align-items:center;flex:none;border-radius:7px 7px 0 0;color:var(--muted)}
.document-tab.active{background:var(--canvas);color:var(--text);box-shadow:0 1px var(--canvas)}
.document-tab.active .content-tab{color:var(--text)}
.document-tab .content-tab{background:transparent;padding-right:4px}
.close-document{width:24px;height:26px;display:grid;place-items:center;border-radius:4px;background:transparent;color:var(--muted);padding:6px;margin-right:4px}
.close-document:hover{background:var(--hover);color:var(--text)}.close-document .icon{width:12px;height:12px}
.outline-context>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

</style>
</head>

document.addEventListener('contextmenu',e=>{const row=e.target.closest('.tree-row,.root-toggle');if(!row)return;e.preventDefault();const root=row.classList.contains('root-toggle'),dir=root||row.dataset.dir==='true',path=root?'':row.dataset.path;state.selected=path;renderTree();const actions=[];if(!dir)actions.push(['打开',()=>openDocument(path,row.dataset.kind)]);else actions.push(['在此切换目录',()=>demo('在此切换目录')]);if(path.endsWith('.html'))actions.push(['在浏览器中打开',()=>demo('在浏览器中打开')]);actions.push(['将路径插入终端',()=>demo('将路径插入终端')],['附加到 Agent',()=>demo('附加到 Agent')],null,['新建文件…',()=>demo('新建文件')],['新建文件夹…',()=>demo('新建文件夹')]);if(!root)actions.push(['重命名…',()=>demo('重命名')]);actions.push(null,['复制路径',()=>copySample('D:\\gh-prj\\hitty'+(path?'\\'+path.replaceAll('/','\\'):''))],['复制文件名',()=>copySample(path.split('/').pop()||'hitty')],['打开文件夹',()=>demo('打开文件夹')],null,[state.hidden?t('hide'):t('show'),()=>{state.hidden=!state.hidden;renderFiles()}]);if(!root)actions.push(null,['删除…',()=>demo('删除（保留原有确认流程）')]);showMenu(e.clientX,e.clientY,actions)});
document.addEventListener('keydown',e=>{const row=e.target.closest('.tree-row');if(row&&['Enter',' '].includes(e.key)){e.preventDefault();openTreeRow(row)}if(e.key==='Escape'){$('context-menu').hidden=true;hideTip()}const mode=e.target.closest('.mode');if(mode&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const modes=['info','outline','git','files'];let i=modes.indexOf(state.mode);i=e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4;setMode(modes[i]);$('mode-'+modes[i]).focus()}});
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(!el)return;const r=el.getBoundingClientRect(),tip=$('tooltip');tip.textContent=el.dataset.tip;tip.hidden=false;tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,r.left+r.width/2-tip.offsetWidth/2))+'px';tip.style.top=r.bottom+7+'px'});document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))hideTip()});
$('compare').onclick=()=>{state.compare=!state.compare;applyFrame()};$('focus-panel').onclick=()=>{state.focus=!state.focus;state.right=true;applyFrame()};$('theme').onclick=()=>{state.dark=!state.dark;applyFrame()};$('language').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';applyFrame();renderMain();renderPanel()};$('reset').onclick=()=>{state=initial();applyFrame();renderMain();renderPanel();$('context-menu').hidden=true};$('toggle-left').onclick=()=>{state.left=!state.left;applyFrame()};$('toggle-right').onclick=()=>{state.right=!state.right;applyFrame()};
const resizer=$('resizer');resizer.dataset.tip=t('width');resizer.addEventListener('pointerdown',e=>{resizer.setPointerCapture(e.pointerId);document.body.classList.add('resizing');hideTip()});resizer.addEventListener('pointermove',e=>{if(!resizer.hasPointerCapture(e.pointerId))return;const right=$('app-window').getBoundingClientRect().right;state.width=Math.round(Math.max(260,Math.min(440,right-e.clientX)));applyFrame()});resizer.addEventListener('pointerup',e=>{resizer.releasePointerCapture(e.pointerId);document.body.classList.remove('resizing')});resizer.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();state.width=Math.max(260,Math.min(440,state.width+(e.key==='ArrowLeft'?10:-10)));applyFrame()}});

function demo(action){toast((state.lang==='zh'?'原型演示：':'Prototype: ')+action)}
function copySample(value){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).then(()=>toast(state.lang==='zh'?'已复制':'Copied')).catch(()=>toast(value));else toast(value)}
function showMenu(x,y,items){const menu=$('context-menu');menu.innerHTML=items.map((item,i)=>item?'<button role="menuitem" data-index="'+i+'">'+esc(item[0])+'</button>':'<hr>').join('');menu.hidden=false;const rect=menu.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(x,innerWidth-rect.width-8))+'px';menu.style.top=Math.max(8,Math.min(y,innerHeight-rect.height-8))+'px';menu.querySelectorAll('button').forEach(button=>button.onclick=()=>{menu.hidden=true;items[Number(button.dataset.index)][1]()})}
function confirmDiscard(message,fn){$('confirm-message').textContent=message;$('confirm-demo').showModal();$('cancel-confirm').onclick=()=>$('confirm-demo').close();$('accept-confirm').onclick=()=>{$('confirm-demo').close();fn()};$('cancel-confirm').focus()}
function stageSample(path,group){if(group==='staged'){state.staged=state.staged.filter(p=>p!==path);state[path.startsWith('docs/')?'untracked':'changes'].push(path)}else{state[group]=state[group].filter(p=>p!==path);state.staged.push(path)}renderGit()}
function updateReviewHint(){
 let message=state.compare?'旧布局对照示意；只比较模式栏、重复标题和分隔线。':'右侧改造独立于左侧会话；从文件树打开 MD，再点大纲查看标题。';
 if(state.mode==='outline')message=['markdown','html'].includes(state.scene)?'大纲自动读取当前预览文档的标题；点击标题跳转，左侧会话保持不变。':state.scene==='agent'?'Agent 对话大纲跟随当前内容，左侧会话不增删、不切换。':'终端命令目录示例；此处仅演示导航，未执行真实命令。';
 $('review-hint').textContent=message;
}
const frameBase=applyFrame;applyFrame=function(){frameBase();updateReviewHint()};
const panelBase=renderPanel;renderPanel=function(){panelBase();updateReviewHint()};
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 if(button.dataset.session)switchSession(button.dataset.session);
 if(button.dataset.currentSession){state.file=null;setScene(state.session)}
 if(button.dataset.document){const doc=state.documents[state.session].find(doc=>doc.path===button.dataset.document);if(doc)openDocument(doc.path,doc.kind)}
 if(button.dataset.closeDocument)closeDocument(button.dataset.closeDocument);
 if(button.dataset.copy!==undefined)copySample(button.dataset.copy);
 if(button.dataset.demo)demo(button.dataset.demo);
 if(button.dataset.menu){const rect=button.getBoundingClientRect();let items=[];
  if(button.dataset.menu==='branch')items=[['ui/right-panel',()=>demo('切换分支')],['main',()=>demo('切换分支')],null,['新建分支…',()=>demo('新建分支')],['获取',()=>demo('获取')],['拉取',()=>demo('拉取')],['推送',()=>demo('推送')]];
  if(button.dataset.menu==='commit')items=[['提交',()=>demo('提交')],['提交并推送',()=>demo('提交并推送')],['提交并同步',()=>demo('提交并同步')],null,[(state.amend?'✓ ':'')+'修订上一次提交',()=>{state.amend=!state.amend;renderGit()}],null,['全部贮藏',()=>demo('全部贮藏')]];
  if(button.dataset.menu==='history')items=[['当前分支',()=>demo('当前分支')],['全部分支',()=>demo('全部分支')],['加载作者头像',()=>demo('加载作者头像')],['刷新',()=>demo('刷新提交历史')]];
  showMenu(rect.right-190,rect.bottom+4,items);
 }
 if(button.dataset.stage)stageSample(button.dataset.stage,button.dataset.group);
 if(button.dataset.stageAll){const group=button.dataset.stageAll;for(const path of [...state[group]])stageSample(path,group)}
 if(button.dataset.discard){const path=button.dataset.discard,group=button.dataset.group;confirmDiscard('放弃对 '+path+' 的更改？这会影响工作区中的修改。',()=>{state[group]=state[group].filter(p=>p!==path);renderGit()})}
 if(button.dataset.discardAll){const group=button.dataset.discardAll;confirmDiscard('放弃这一组全部未暂存的更改？',()=>{state[group]=[];renderGit()})}
 if(button.dataset.foldGroup){const group=button.dataset.foldGroup;state.collapsedGroups.has(group)?state.collapsedGroups.delete(group):state.collapsedGroups.add(group);renderGit()}
 if(button.id==='history-toggle'){state.history=!state.history;renderGit()}
});

document.querySelectorAll('[data-brand]').forEach(el=>el.src=ASSETS.brand);$('toggle-left').innerHTML=icon('panel-left');$('toggle-right').innerHTML=icon('panel-right');$('minimize-glyph').innerHTML=icon('minus');$('maximize-glyph').innerHTML=icon('square');$('close-glyph').innerHTML=icon('close');applyFrame();renderMain();renderPanel();
</script>
</body>
